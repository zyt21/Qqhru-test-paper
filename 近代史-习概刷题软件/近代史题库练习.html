    </style>
</head>

    // 解析新思想题库
    function parseThoughtQuestions(raw) {
        const blocks = raw.split(/(?=第\s*\d+\s*题|\d+\.\s*多选题|^\d+\s*题)/m);
        const questions = [];
        const optionLetters = ['A','B','C','D','E','F','G','H'];
        blocks.forEach(block => {
            if (!block.trim()) return;
            const isMulti = /多选题/.test(block);
            const idMatch = /(?:第\s*)?(\d+)\s*题?/.exec(block);
            if (!idMatch) return;
            const id = parseInt(idMatch[1]);
            const stemMatch = /题干\$\s*([\s\S]*?)(?=答案\$)/.exec(block);
            if (!stemMatch) return;
            let stem = stemMatch[1].trim();
            const answerMatch = /答案\$\s*([A-E]+)/i.exec(block);
            if (!answerMatch) return;
            let answer = answerMatch[1].toUpperCase();
            const optionLines = [];
            const optRegex = /^([A-E])\s+(.+)$/gm;
            let m;
            while ((m = optRegex.exec(block)) !== null) {
                optionLines.push({ letter: m[1], text: m[2].trim() });
            }
            let options = [];
            let type = 'single';
            if (optionLines.length >= 2) {
                options = optionLines.map(o => o.text);
                type = isMulti ? 'multi' : 'single';
            } else {
                // 判断题
                type = 'judge';
                options = ['对', '错'];
                // 答案映射: A对 B错 保持不变
            }
            questions.push({ id, type, question: stem, options, answer });
        });
        return questions;
    }

    function buildQuestionHTML(q, context) {
        const hint = (q.type==='multi' && context==='practice') ? '（可多选，选对自动跳转，选错显示答案）' : '';
        let html = `<div class="question-card"><div class="question-header"><span class="question-num">${q.id}</span><span class="question-type">${q.type==='single'?'单选':q.type==='multi'?'多选':'判断'}</span>${hint?`<span class="question-hint">${hint}</span>`:''}</div><div class="question-text">${q.question}</div><ul class="options-list">`;
        const optLetters = ['A','B','C','D','E','F'];
        q.options.forEach((opt,i)=>{
            const letter = optLetters[i];
            const inputType = q.type==='single'||q.type==='judge'?'radio':'checkbox';
            const name = context==='practice'?`pq_${q.id}`:`eq_${q.id}`;
            const idStr = `opt_${context}_${q.id}_${i}`;
            html += `<li class="option-item" data-letter="${letter}"><input type="${inputType}" name="${name}" id="${idStr}" value="${letter}"><label for="${idStr}" class="option-label">${letter}. ${opt}</label></li>`;
        });
        html += `</ul><div class="button-group"><button class="btn-next hidden" id="nextBtn">▶ 下一题</button></div><div id="feedbackArea"></div></div>`;
        return html;
    }

    function bindPracticeEvents(q) {
        const nextBtn = document.getElementById('nextBtn');
        const fb = document.getElementById('feedbackArea');
        document.querySelectorAll('.option-item').forEach(item=>{
            item.addEventListener('click', function(e){
                if (answered) return;
                const input = this.querySelector('input');
                if (input && e.target !== input) { input.checked = !input.checked; if (q.type!=='multi' && input.checked) document.querySelectorAll(`input[name^="pq_${q.id}"]`).forEach(inp=>{ if(inp!==input) inp.checked=false; }); }
                practiceAutoCheck(q, fb, nextBtn);
            });
        });
    }

    function practiceAutoCheck(q, fb, nextBtn) {
        const checked = document.querySelectorAll(q.type==='multi'?`input[name^="pq_${q.id}_"]:checked`:`input[name^="pq_${q.id}"]:checked`);
        const userSel = Array.from(checked).map(inp=>inp.value).sort().join('');
        if (q.type==='multi' && userSel.length===0) return;
        const correct = [...q.answer].sort().join('');
        const hasWrong = q.type==='multi' && [...userSel].some(l=>!q.answer.includes(l));
        if (hasWrong) { practiceShowResult(false,q,fb,nextBtn); return; }
        if (userSel === correct) { practiceShowResult(true,q,fb,nextBtn); return; }
        if (q.type==='multi' && userSel.length < correct.length) return;
        if (q.type!=='multi') practiceShowResult(false,q,fb,nextBtn);
    }

    function practiceShowResult(passed, q, fb, nextBtn) {
        if (answered) return;
        answered=true; isCorrect=passed;
        disableInputs(`pq_${q.id}`);
        const correctLetters = q.answer.split('');
        document.querySelectorAll('.option-item').forEach(item=>{ if(correctLetters.includes(item.dataset.letter)) item.classList.add('correct-highlight'); });
        const checked = document.querySelectorAll(q.type==='multi'?`input[name^="pq_${q.id}_"]:checked`:`input[name^="pq_${q.id}"]:checked`);
        const userLetters = Array.from(checked).map(inp=>inp.value);
        document.querySelectorAll('.option-item').forEach(item=>{ if(userLetters.includes(item.dataset.letter) && !correctLetters.includes(item.dataset.letter)) item.classList.add('user-wrong'); });
        if (passed) {
            practiceCorrectCount++; updateScore();
            fb.innerHTML='<div class="feedback correct">✅ 回答正确！</div>';
            nextBtn.classList.add('hidden');
            autoJumpTimer=setTimeout(()=>practiceNext(),300);
        } else {
            const correctStr = q.answer.split('').map(l=>`${l}. ${q.options[['A','B','C','D','E','F'].indexOf(l)]}`).join('，');
            fb.innerHTML=`<div class="feedback wrong">❌ 回答错误。<div class="correct-answer-text">👉 正确答案：${correctStr}</div></div>`;
            nextBtn.classList.remove('hidden');
            nextBtn.onclick=()=>{ clearTimer(); practiceNext(); };
        }
    }

    function initExam() { const sh=shuffleArray(currentQuestions); examQuestions=sh.slice(0,Math.min(EXAM_COUNT,currentQuestions.length)); examUserAnswers=new Array(examQuestions.length).fill(null); examResults=new Array(examQuestions.length).fill(null); examCurrentIndex=0; examSubmitted=false; }

            document.querySelectorAll('.option-item').forEach(item=>{ if(userSel.includes(item.dataset.letter)) item.classList.add('user-correct-only'); });
            fb.innerHTML='<div class="feedback correct">✅ 回答正确！</div>'; nextBtn.classList.add('hidden');
            updateScore(); updateIndexHighlight(); buildIndexPanel();
            if(examResults.every(r=>r!==null)) autoJumpTimer=setTimeout(()=>submitExam(),800);
            else autoJumpTimer=setTimeout(()=>examNext(),1000);
        } else {
            document.querySelectorAll('.option-item').forEach(item=>{ if(userSel.includes(item.dataset.letter)) item.classList.add('user-wrong'); });
            fb.innerHTML='<div class="feedback wrong">❌ 回答错误。</div>'; nextBtn.classList.remove('hidden');
            nextBtn.onclick=()=>{ clearTimer(); examNext(); };
            updateScore(); updateIndexHighlight(); buildIndexPanel();
        }
    }
    function examNext() { clearTimer(); let next=examCurrentIndex+1; while(next<examQuestions.length&&examResults[next]!==null) next++; if(next>=examQuestions.length){ if(examResults.every(r=>r!==null)) submitExam(); else{ const first=examResults.findIndex(r=>r===null); if(first>=0){ examCurrentIndex=first; renderAll(); } else submitExam(); } } else { examCurrentIndex=next; renderAll(); } }
    function examPrev() { clearTimer(); if(examCurrentIndex>0){ examCurrentIndex--; renderAll(); } }
    function submitExam() { clearTimer(); examSubmitted=true; showExamStats(); }
    function showExamStats() {
        quizArea.innerHTML=''; quizArea.classList.add('hidden'); completionArea.classList.add('hidden'); examStatsArea.classList.remove('hidden');
        const total=examQuestions.length, correctNum=examResults.filter(r=>r==='correct').length, wrongNum=examResults.filter(r=>r==='wrong').length;
        const acc=Math.round((correctNum/total)*100);
        let html=`<h2>📊 模拟练习结果</h2><p>${currentBankName} · 共${total}题</p><div class="stats-numbers"><div class="stat-item"><div class="num green">${correctNum}</div><div class="lbl">✅ 正确</div></div><div class="stat-item"><div class="num red">${wrongNum}</div><div class="lbl">❌ 错误</div></div><div class="stat-item"><div class="num" style="color:#1565c0;">${acc}%</div><div class="lbl">📈 正确率</div></div></div>`;
        const wrongList=[]; examQuestions.forEach((q,i)=>{ if(examResults[i]==='wrong') wrongList.push({q, userAns:examUserAnswers[i], index:i}); });
        if(wrongList.length>0){
            html+=`<div class="wrong-review"><h3>📋 错题回顾（${wrongList.length}题）</h3>`;
            wrongList.forEach((item,wi)=>{
                const q=item.q; const userOpts=item.userAns?item.userAns.split('').map(l=>`${l}. ${q.options[['A','B','C','D','E','F'].indexOf(l)]}`).join('；'):'未作答';
                const correctOpts=q.answer.split('').map(l=>`${l}. ${q.options[['A','B','C','D','E','F'].indexOf(l)]}`).join('；');
                html+=`<div class="wrong-card" id="wc_${wi}" onclick="this.classList.toggle('open')"><div class="wc-header"><span>📌 第${q.id}题（${q.type==='multi'?'多选':q.type==='judge'?'判断':'单选'}）</span><span class="wc-badge wrong">错误</span></div><div class="wc-detail"><p><strong>题目：</strong>${q.question}</p><p style="color:#c62828;"><strong>你的答案：</strong>${userOpts}</p><p style="color:#2e7d32;"><strong>正确答案：</strong>${correctOpts}</p></div></div>`;
            });
            html+=`</div>`;
        }
        html+=`<div style="text-align:center;margin-top:20px;"><button class="btn-reset" onclick="window._resetExam()">🔄 重新模拟</button></div>`;
        examStatsArea.innerHTML=html;
        window._resetExam = ()=>{ clearTimer(); initExam(); hidePanels(); quizArea.classList.remove('hidden'); renderAll(); };
    }

    function disableInputs(prefix){ document.querySelectorAll(`input[name^="${prefix}"]`).forEach(inp=>inp.disabled=true); }
    function updateIndexHighlight(){ const btns=indexPanel.querySelectorAll('.index-btn'); btns.forEach((btn,idx)=>{ btn.classList.remove('current'); if(mode==='practice'&&idx===practiceIndex) btn.classList.add('current'); if(mode==='exam'&&idx===examCurrentIndex) btn.classList.add('current'); }); }

    // 通用事件
    prevBtn.onclick=()=>{ clearTimer(); if(mode==='practice') practicePrev(); else examPrev(); };
    nextBtnNav.onclick=()=>{ clearTimer(); if(mode==='practice') practiceNext(); else examNext(); };
    toggleIndexBtn.onclick=()=>{ indexPanel.classList.toggle('hidden'); if(!indexPanel.classList.contains('hidden')) buildIndexPanel(); };
    submitExamBtn.onclick=()=>{ if(mode==='exam'&&!examSubmitted) submitExam(); };
    resetBtn.onclick=()=>{ clearTimer(); if(mode==='practice'){ resetPractice(); renderAll(); } else { initExam(); hidePanels(); quizArea.classList.remove('hidden'); renderAll(); } };
    restartBtn.onclick=()=>{ clearTimer(); resetPractice(); renderAll(); };
    tabPractice.onclick=()=>{ if(mode!=='practice'){ mode='practice'; tabPractice.classList.add('active'); tabExam.classList.remove('active'); hidePanels(); quizArea.classList.remove('hidden'); renderAll(); } };
    tabExam.onclick=()=>{ if(mode!=='exam'){ mode='exam'; tabExam.classList.add('active'); tabPractice.classList.remove('active'); if(examQuestions.length===0||examSubmitted) initExam(); hidePanels(); quizArea.classList.remove('hidden'); renderAll(); } };

})();
</script>
</body>
</html>
