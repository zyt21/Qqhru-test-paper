<head>

    <style>
        * {

            align-items: center;
            justify-content: center;

            border-radius: 2rem;
            padding: 0.5rem 1.2rem;

        }
        .btn-grid:hover {

        }
        .btn-next {
            background: #10b981;
            color: white;
            border-radius: 2rem;

            font-size: 1rem;

            color: #94a3b8;
        }

            color: white;
            border-radius: 2rem;

            cursor: not-allowed;
            color: #64748b;
        }

            overflow-y: auto;
        }

            color: #0f172a;
            margin-bottom: 2rem;

            gap: 0.75rem;

            align-items: center;
            gap: 0.8rem;
            padding: 0.9rem 1.2rem;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 1.2rem;

            background: #e0e7ff;
            color: #1e1b4b;
        }
        .option-item.correct-highlight {
            border-color: #10b981;
            background: #d1fae5;
            color: #065f46;
        }

            background: #fee2e2;

            background: #f1f5f9;

            height: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.8rem;
            color: #475569;
            flex-shrink: 0;

        }

            padding: 1rem 1.2rem;
            border-radius: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            animation: fadeIn 0.2s ease;

            background: #d1fae5;
            color: #065f46;
        }
        .feedback.wrong {
            background: #fee2e2;
            color: #991b1b;
        }

            font-size: 0.85rem;
            color: #64748b;
            margin-top: 0.5rem;
            font-style: italic;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,23,42,0.5);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.2s;
        }
        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 2rem 1.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-title {
            font-weight: 700;
            font-size: 1.3rem;
            color: #1e293b;
        }

            background: #f1f5f9;
            border: none;
            font-size: 1.5rem;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 1rem;
            cursor: pointer;
            color: #475569;
        }
        .grid-numbers {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(2.8rem, 1fr));
            gap: 0.5rem;
        }
        .num-btn {
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: #f1f5f9;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;

            background: #e2e8f0;

            background: #10b981;
            color: white;
        }
        .num-btn.wrong-badge {
            background: #ef4444;
            color: white;
        }
        .num-btn.current {
            box-shadow: 0 0 0 3px #6366f1;
        }

            from { opacity: 0; transform: scale(0.96); }

    </style>
</head>

        // ---------- 解析题库 ----------
        function parseQuestions(raw) {
            // 预处理：替换常见OCR错误
            let text = raw.replace(/题干\$/g, '题干：');
            text = text.replace(/答案\$/g, '答案：');
            text = text.replace(/解析\$/g, '解析：');
            // 移除分页行
            text = text.replace(/^--\s*\d+\s*of\s*\d+\s*--\s*$/gm, '');
            
            const lines = text.split(/\r?\n/);
            const questions = [];
            
            // 先找到所有题头行索引
            const headerIndices = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                // 多选题头
                if (/^\d+\.多选题/.test(line)) {
                    headerIndices.push(i);
                }
                // 单选题头 (第XX题 或 XX 题)
                else if (/^第?\s*\d+\s*题\s*$/.test(line) && !line.includes('多选题')) {
                    headerIndices.push(i);
                }
                // 判断题头：纯数字行且下一行是题干行
                else if (/^\d+\s*$/.test(line) && i+1 < lines.length && lines[i+1].trim().startsWith('题干：')) {
                    // 避免误将选项行当题头（选项行不会紧跟题干）
                    headerIndices.push(i);
                }
            }

            // 如果没有找到题头，返回空
            if (headerIndices.length === 0) return [];

            // 辅助函数：从题头行索引获取题号
            function getQuestionNumber(line) {
                const match = line.match(/(\d+)/);
                return match ? parseInt(match[1], 10) : null;
            }

            // 逐块解析
            for (let idx = 0; idx < headerIndices.length; idx++) {
                const start = headerIndices[idx];
                const end = (idx + 1 < headerIndices.length) ? headerIndices[idx+1] : lines.length;
                const headerLine = lines[start].trim();
                let type = 'single'; // 默认单选
                if (/多选题/.test(headerLine)) {
                    type = 'multiple';
                } else if (/^\d+\s*$/.test(headerLine)) {
                    type = 'judge'; // 暂定，后面根据答案修正
                }
                const qNum = getQuestionNumber(headerLine) || (idx+1);
                
                let stem = '';
                const options = [];
                let answerRaw = '';
                let explanation = '';
                
                let state = 'stem'; // stem | options | answer | explanation
                for (let i = start + 1; i < end; i++) {
                    const rawLine = lines[i];
                    const line = rawLine.trim();
                    if (!line) continue;
                    
                    if (state === 'stem') {
                        if (line.startsWith('题干：') || line.startsWith('题干:')) {
                            stem = line.replace(/^题干[：:]\s*/, '').trim();
                            state = 'options';
                        } else if (line.startsWith('答案：') || line.startsWith('答案:')) {
                            // 没有选项行，直接出现答案（可能是判断题或特殊单选）
                            answerRaw = line.replace(/^答案[：:]\s*/, '').trim();
                            state = 'explanation';
                        }
                    } else if (state === 'options') {
                        // 匹配选项行 A ... 或 A. ...
                        const optMatch = line.match(/^([A-E])[\.\s、]\s*(.+)/);
                        if (optMatch) {
                            options.push({ letter: optMatch[1], text: optMatch[2].trim() });
                        } else if (line.startsWith('答案：') || line.startsWith('答案:')) {
                            answerRaw = line.replace(/^答案[：:]\s*/, '').trim();
                            state = 'explanation';
                        } else if (line.startsWith('解析：') || line.startsWith('解析:')) {
                            explanation = line.replace(/^解析[：:]\s*/, '').trim();
                            state = 'explanation';
                        }
                    } else if (state === 'explanation') {
                        if (line.startsWith('解析：') || line.startsWith('解析:')) {
                            explanation = line.replace(/^解析[：:]\s*/, '').trim();
                        }
                    }
                    // 如果已经进入answer但还没到explanation，继续检测解析
                }
                
                // 后处理答案
                let answer = '';
                if (type === 'judge' || (options.length === 0 && (answerRaw === '正确' || answerRaw === '错误' || /^[AB]$/.test(answerRaw)))) {
                    // 判断题
                    type = 'judge';
                    const fixedOptions = [
                        { letter: 'A', text: '正确' },
                        { letter: 'B', text: '错误' }
                    ];
                    // 清除原有options，用固定选项
                    options.length = 0;
                    options.push(...fixedOptions);
                    
                    if (answerRaw === '正确' || answerRaw === 'A' || answerRaw.includes('对')) {
                        answer = 'A';
                    } else if (answerRaw === '错误' || answerRaw === 'B' || answerRaw.includes('错')) {
                        answer = 'B';
                    } else {
                        // 尝试从字符串提取A或B
                        const abMatch = answerRaw.match(/[AB]/);
                        answer = abMatch ? abMatch[0] : 'B';
                    }
                } else if (type === 'multiple') {
                    // 多选题答案如 "BC" 或 "ABCD"
                    answer = answerRaw.replace(/\s/g, '').toUpperCase();
                } else {

                    answer = answerRaw.trim().charAt(0).toUpperCase();
                    if (answer && !/[A-E]/.test(answer)) {
                        // 可能是文字“正确”之类的，转换为A
                        if (answerRaw.includes('正确') || answerRaw.includes('对')) answer = 'A';
                        else if (answerRaw.includes('错误') || answerRaw.includes('错')) answer = 'B';
                    }
                }
                
                // 如果选项为空且type为single，但答案包含多个字母，可能是多选误判
                if (type === 'single' && answer.length > 1 && /^[A-E]+$/.test(answer)) {
                    type = 'multiple';
                }
                
                questions.push({
                    id: idx + 1,
                    originalNum: qNum,
                    type: type,
                    stem: stem,
                    options: options,
                    answer: answer,
                    explanation: explanation
                });
            }
            return questions;

            results: new Array(questions.length).fill(null), // true正确 false错误 null未答
        };

        // ---------- DOM 元素 ----------
        const mainContent = document.getElementById('mainContent');
        const actionArea = document.getElementById('actionArea');
        const progressText = document.getElementById('progressText');
        const openGridBtn = document.getElementById('openGridBtn');
        const modalContainer = document.getElementById('modalContainer');

        // 当前题目的DOM元素引用（用于更新样式）
        let currentOptionElements = [];

        // 渲染当前题目
        function renderQuestion() {
            const q = questions[state.currentIndex];
            if (!q) return;
            
            progressText.textContent = `第 ${state.currentIndex + 1} / ${questions.length} 题`;
            
            // 题干
            let html = `<div class="question-stem">${q.stem}</div>`;
            
            // 选项
            html += '<div class="options-list" id="optionsContainer">';
            q.options.forEach((opt, idx) => {
                const letter = opt.letter;
                const inputType = q.type === 'multiple' ? 'checkbox' : 'radio';
                // 我们用自定义div模拟，不使用原生input，便于样式控制
                html += `
                    <div class="option-item" data-letter="${letter}" data-index="${idx}">
                        <span class="option-letter">${letter}</span>
                        <span class="option-text">${opt.text}</span>
                    </div>`;
            });
            html += '</div>';
            
            mainContent.innerHTML = html;
            
            // 绑定选项点击事件
            const optionDivs = document.querySelectorAll('.option-item');
            currentOptionElements = Array.from(optionDivs);
            optionDivs.forEach(div => {
                div.addEventListener('click', () => handleOptionClick(div));
            });
            
            // 根据用户历史作答恢复状态
            const userAns = state.userAnswers[state.currentIndex];
            if (userAns) {
                if (q.type === 'multiple') {
                    const selectedLetters = userAns.split('');
                    optionDivs.forEach(div => {
                        if (selectedLetters.includes(div.dataset.letter)) {
                            div.classList.add('selected');
                        }
                    });
                } else {
                    optionDivs.forEach(div => {
                        if (div.dataset.letter === userAns) {
                            div.classList.add('selected');
                        }
                    });
                }
            }
            
            // 如果已经评判过，显示结果样式并禁用选项
            if (state.results[state.currentIndex] !== null) {
                showResultFeedback(state.results[state.currentIndex]);
            }
            
            // 渲染操作按钮
            renderActions();
        }

        // 处理选项点击
        function handleOptionClick(div) {
            const q = questions[state.currentIndex];
            if (state.results[state.currentIndex] !== null) return; // 已经评判过，忽略点击
            
            if (q.type === 'multiple') {
                // 切换选中状态
                div.classList.toggle('selected');
                // 更新userAnswers
                updateMultipleAnswer();
            } else {
                // 单选/判断：取消其他选中，选中当前
                currentOptionElements.forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                state.userAnswers[state.currentIndex] = div.dataset.letter;
                // 单选/判断立即评判
                judgeCurrent();
            }
            renderActions();
        }

        function updateMultipleAnswer() {
            const selected = currentOptionElements
                .filter(el => el.classList.contains('selected'))
                .map(el => el.dataset.letter)
                .sort()
                .join('');
            state.userAnswers[state.currentIndex] = selected;
        }

        // 评判当前题目
        function judgeCurrent() {
            const q = questions[state.currentIndex];
            const userAns = state.userAnswers[state.currentIndex];
            if (!userAns) return;
            
            const correctAns = q.answer;
            let isCorrect = false;
            if (q.type === 'multiple') {
                // 多选答案字母排序后比较
                const sortedUser = userAns.split('').sort().join('');
                const sortedCorrect = correctAns.split('').sort().join('');
                isCorrect = (sortedUser === sortedCorrect);
            } else {
                isCorrect = (userAns === correctAns);
            }
            
            state.results[state.currentIndex] = isCorrect;
            showResultFeedback(isCorrect);
            
            if (isCorrect) {
                // 正确0.3秒自动跳转下一题
                setTimeout(() => {
                    if (state.currentIndex < questions.length - 1) {
                        state.currentIndex++;
                        renderQuestion();
                    }
                }, 300);
            }
            renderActions();
        }

        function showResultFeedback(isCorrect) {
            // 移除已有反馈
            const oldFeedback = document.querySelector('.feedback');
            if (oldFeedback) oldFeedback.remove();
            
            const q = questions[state.currentIndex];
            // 高亮选项
            currentOptionElements.forEach(el => {
                el.classList.add('disabled');
                const letter = el.dataset.letter;
                if (q.answer.includes(letter)) {
                    el.classList.add('correct-highlight');
                }
                if (state.userAnswers[state.currentIndex] && state.userAnswers[state.currentIndex].includes(letter) && !q.answer.includes(letter)) {
                    el.classList.add('wrong-highlight');
                }
            });
            
            let feedbackHtml = '';
            if (isCorrect) {
                feedbackHtml = `<div class="feedback correct">✅ 回答正确！</div>`;
            } else {
                const correctDisplay = q.type === 'judge' ? (q.answer === 'A' ? '正确' : '错误') : q.answer;
                feedbackHtml = `<div class="feedback wrong">❌ 回答错误，正确答案是 <strong>${correctDisplay}</strong></div>`;
                if (q.explanation) {
                    feedbackHtml += `<div class="note">💡 ${q.explanation}</div>`;
                }
            }
            mainContent.insertAdjacentHTML('beforeend', feedbackHtml);
        }

        // 渲染操作按钮
        function renderActions() {
            const q = questions[state.currentIndex];
            let html = '';
            
            if (q.type === 'multiple' && state.results[state.currentIndex] === null) {
                // 多选题且未评判，显示提交按钮
                html += `<button class="btn btn-submit" id="submitMultiBtn" ${!state.userAnswers[state.currentIndex] ? 'disabled' : ''}>提交答案</button>`;
            }
            
            // 如果已经评判且错误，或者评判后用户想手动下一题（正确自动跳转，但也可以显示）
            if (state.results[state.currentIndex] !== null) {
                if (state.currentIndex < questions.length - 1) {
                    html += `<button class="btn btn-next" id="nextBtn">下一题 ▶</button>`;
                } else {
                    html += `<p style="margin-top:1rem; color:#64748b;">🎉 已完成全部题目！</p>`;
                }
            }
            
            actionArea.innerHTML = html;
            
            // 绑定事件
            const submitBtn = document.getElementById('submitMultiBtn');
            if (submitBtn) {
                submitBtn.addEventListener('click', () => {
                    updateMultipleAnswer();
                    if (state.userAnswers[state.currentIndex]) {
                        judgeCurrent();
                    }
                });
            }
            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    if (state.currentIndex < questions.length - 1) {
                        state.currentIndex++;
                        renderQuestion();
                    }
                });
            }
        }

        // ---------- 题号面板 ----------
        function openGridPanel() {
            // 移除已有面板
            modalContainer.innerHTML = '';
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <span class="modal-title">📌 题号导航</span>
                        <button class="close-btn" id="closeGridBtn">&times;</button>
                    </div>
                    <div class="grid-numbers" id="gridContainer"></div>
                </div>
            `;
            modalContainer.appendChild(overlay);
            
            const grid = document.getElementById('gridContainer');
            questions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.textContent = idx + 1;
                if (state.results[idx] === true) btn.classList.add('correct-badge');
                else if (state.results[idx] === false) btn.classList.add('wrong-badge');
                if (idx === state.currentIndex) btn.classList.add('current');
                btn.addEventListener('click', () => {
                    state.currentIndex = idx;
                    renderQuestion();
                    modalContainer.innerHTML = ''; // 关闭面板
                });
                grid.appendChild(btn);
            });
            
            document.getElementById('closeGridBtn').addEventListener('click', () => {
                modalContainer.innerHTML = '';
            });
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) modalContainer.innerHTML = '';
            });
        }
        
        openGridBtn.addEventListener('click', openGridPanel);

        // 键盘监听：左右键切换题目（仅在未评判或评判后手动切换）
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && state.currentIndex < questions.length - 1) {
                e.preventDefault();
                state.currentIndex++;
                renderQuestion();
            } else if (e.key === 'ArrowLeft' && state.currentIndex > 0) {
                e.preventDefault();
                state.currentIndex--;
                renderQuestion();
            }
        });

        // 初始渲染
        if (questions.length > 0) {
            renderQuestion();
        } else {
            mainContent.innerHTML = '<p>题库解析失败，请刷新重试。</p>';
        }
    })();
</script>
</body>
</html>
